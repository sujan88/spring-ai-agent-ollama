name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Unit tests + RagIT (Testcontainers pgvector, fake embeddings: no API key, no cost).
      # EvalIT calls a real model and stays opt-in: mvn verify -Pevals
      - name: Verify
        run: mvn -B -ntp verify
