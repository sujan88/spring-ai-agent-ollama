name: Evals

# Model-based evals cost money and need a key, so they do not run on every push.
# Run them by hand (Actions > Evals > Run workflow) or let the weekly schedule catch drift.
# Needs the repository secret OPENAI_API_KEY; without it the job reports that and stops.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check for API key
        if: env.OPENAI_API_KEY == ''
        run: echo "::warning::OPENAI_API_KEY secret is not set; skipping evals."
      # EvalIT: relevancy + faithfulness on the golden questions.
      # ToolTrajectoryEvalIT: tool choice and safety cases.
      - name: Run evals
        if: env.OPENAI_API_KEY != ''
        run: mvn -B -ntp verify -Pevals
      - name: Keep eval reports
        if: always() && env.OPENAI_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: target/failsafe-reports/
