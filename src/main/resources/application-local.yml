# Local: everything runs on your machine. docker compose starts Postgres (pgvector) and Ollama;
# Spring Boot connects to both automatically. First start pulls the models (a few GB).
spring:
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      init:
        pull-model-strategy: when_missing
        timeout: 30m              # first pull is ~5 GB; the default (5 minutes) is often too short
        max-retries: 2
      chat:
        options:
          model: llama3.1:8b
          temperature: 0.2
      embedding:
        model: nomic-embed-text
    vectorstore:
      pgvector:
        dimensions: 768           # nomic-embed-text
        table-name: vector_store_ollama
    mcp:
      server:
        enabled: true

app:
  security:
    demo-mode: true
  rag:
    admin-endpoint: true
